agent:
  cost_limits:
    cost_limit: 20
    net_cost_limit: 0
    step_limit: 250
  type: opencode
  version: 1.18.10
agent_config_path: configs/agents/opencode.yaml
environment:
  commands:
    agent_command: python
    command: uv run
    entry_file: '{entry_file}.py'
  docker:
    image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
    mount_workspace: true
    workdir: /workspace
  environment:
    env:
      PIP_CACHE_DIR: /tmp/pip-cache-dir
      PIP_CONFIG_FILE: /tmp/pip-conf
      UV_CACHE_DIR: /tmp/uv-cache
  name: python3.12
  setup:
    eval_commands:
    - uv init
    - uv add -r requirements.txt
    resume_commands:
    - python -m venv .venv || true
    - .venv/bin/pip install -r requirements.txt 2>/dev/null || true
  type: docker
environment_config_path: configs/environments/docker-python3.12-uv.yaml
model:
  name: deepseek-v4-flash
  provider: deepseek
one_shot:
  enabled: false
  include_first_prefix: false
  prefix: ''
output_path: outputs/deepseek-v4-flash/opencode-1.18.10_just-solve_high_20260731T0818
pass_policy: any
problems:
- circuit_eval
- database_migration
- dynamic_config_service_api
prompt_content: 'Implement a program that 100% solves the specification. That is all
  you need to do.

  {% if not is_continuation -%}

  Use a virtual environment and ensure that a `requirements.txt` is present with any
  dependencies you need to solve the problem.

  {% else -%}

  Keep using the same virtual environment you started with, update `requirements.txt`
  with any new dependencies you need.

  {% endif -%}


  Your task is:

  {{ spec.strip() }}

  '
prompt_path: configs/prompts/just-solve.jinja
save_dir: outputs
save_template: deepseek-v4-flash/opencode-1.18.10_just-solve_high_20260731T0818
thinking: high
thinking_max_tokens: null
