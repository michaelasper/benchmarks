agent:
  binary: pi
  cost_limits:
    cost_limit: 0
    net_cost_limit: 0
    step_limit: 0
  env: {}
  extra_args: []
  timeout: 7200
  type: pi
  version: 0.84.2
agent_config_path: agent_config.yaml
environment:
  commands:
    agent_command: python
    command: uv run
    entry_file: '{entry_file}.py'
  docker:
    image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
    mount_workspace: true
    workdir: /workspace
  environment:
    env:
      PIP_CACHE_DIR: /tmp/pip-cache-dir
      PIP_CONFIG_FILE: /tmp/pip-conf
      UV_CACHE_DIR: /tmp/uv-cache
  name: python3.12
  setup:
    eval_commands:
    - uv init
    - uv add -r requirements.txt
    resume_commands:
    - python -m venv .venv || true
    - .venv/bin/pip install -r requirements.txt 2>/dev/null || true
  type: docker
environment_config_path: environment.yaml
model:
  name: glm-5.3
  provider: openrouter
one_shot:
  enabled: false
  include_first_prefix: false
  prefix: ''
pass_policy: all-cases
problems:
- cfgpipe
- circuit_eval
- code_search
- dag_execution
- database_migration
- datagate
- dynamic_buffer
- dynamic_config_service_api
- env_manager
- etl_pipeline
- eve_industry
- eve_jump_planner
- eve_market_tools
- eve_route_planner
- execution_server
- file_backup
- file_merger
- file_query_tool
- forge
- l2m
- layered_config_synthesizer
- log_query
- meshctl
- metric_transform_lang
- migrate_configs
- mocked_http
- mvvault
- pwd_manager
- recli
- rejector
- sheeteval
- sith
- test_translator
- textdrop
- trajectory_api
- xjq
prompt_content: 'Implement a program that 100% solves the specification. That is all
  you need to do.

  {% if not is_continuation -%}

  Use a virtual environment and ensure that a `requirements.txt` is present with any
  dependencies you need to solve the problem.

  {% else -%}

  Keep using the same virtual environment you started with, update `requirements.txt`
  with any new dependencies you need.

  {% endif -%}


  Your task is:

  {{ spec.strip() }}

  '
prompt_path: prompt.jinja
thinking: xhigh
thinking_max_tokens: null
